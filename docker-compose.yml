services:
  discovery-city-db:
    image: pgvector/pgvector:pg16
    container_name: discovery-city-postgres
    environment:
      POSTGRES_USER: discovery_user
      POSTGRES_PASSWORD: WL71dM5oM2s36FP6ZrBo
      POSTGRES_DB: discoverycity
    ports:
      - "5435:5432"
    volumes:
      - discovery_city_data:/var/lib/postgresql/data
    restart: unless-stopped

  bookcity-db:
    image: mariadb:10.11
    container_name: bookcity-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: bookcity
      MARIADB_USER: bookcity_user
      MARIADB_PASSWORD: bookcity_password
    ports:
      - "3306:3306"
    volumes:
      - /data/BookCity/mariadb:/var/lib/mysql
      - /data/BookCity/imports:/imports
    command:
      - --innodb-buffer-pool-size=1G
      - --innodb-log-file-size=256M
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-flush-method=O_DIRECT
      - --max-allowed-packet=64M
    restart: unless-stopped

  bookcity-elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: bookcity-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - /data/BookCity/elasticsearch:/usr/share/elasticsearch/data
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: bookcity-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://bookcity-elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - bookcity-elastic
    restart: unless-stopped

volumes:
  discovery_city_data:
