<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABC.DiscoveryCity</title>
    <base href="/" />
    <link id="telerik-theme" rel="stylesheet"
          href="_content/Telerik.UI.for.Blazor/css/kendo-theme-default/all.css" />

    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="ABC.DiscoveryCity.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/force-graph"></script>
    <script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>
    <script src="js/daemask-viz.js"></script>
</head>

<body class="k-body">
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script type="importmap"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/Telerik.UI.for.Blazor/js/telerik-blazor.js"></script>
    <script src="js/fileSystem.js"></script>
    <script src="js/fileSystemAccess.js"></script>
    <script src="js/myLibrary.js"></script>
    <script src="js/pageState.js"></script>
    <script src="js/semanticSearch.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
    <script>
        // --- Theme switcher ---
        window.themeChanger = {
            change: function (newUrl) {
                var oldLink = document.getElementById("telerik-theme");
                if (newUrl === oldLink.getAttribute("href")) return;

                var newLink = document.createElement("link");
                newLink.setAttribute("id", "telerik-theme");
                newLink.setAttribute("rel", "stylesheet");
                newLink.setAttribute("href", newUrl);
                newLink.onload = function () {
                    oldLink.parentElement.removeChild(oldLink);
                };
                document.getElementsByTagName("head")[0].appendChild(newLink);
            },
            getCurrent: function () {
                var link = document.getElementById("telerik-theme");
                return link ? link.getAttribute("href") : "";
            }
        };

        // Apply saved theme on load (before Blazor starts)
        (function () {
            var saved = localStorage.getItem("dc-theme-url");
            if (saved) {
                window.themeChanger.change(saved);
            }
        })();

        // --- Existing helpers ---
        window.scrollGridRowIntoView = (rowIndex, rowHeight) => {
            const container = document.querySelector('.k-grid-content');
            if (!container) return;
            const targetTop = rowIndex * rowHeight;
            const targetBottom = targetTop + rowHeight;
            const viewTop = container.scrollTop;
            const viewBottom = viewTop + container.clientHeight;
            if (targetBottom > viewBottom) {
                container.scrollTop += rowHeight;
            } else if (targetTop < viewTop) {
                container.scrollTop -= rowHeight;
            }
        };
        window.scrollBrowseCardIntoView = (index) => {
            const cards = document.querySelectorAll('.browse-card');
            if (cards && cards.length > index) {
                cards[index].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        };
        window.scrollElementIntoView = (id) => {
            const element = document.getElementById(id);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        };
        window.triggerFileDownload = (url, fileName) => {
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = fileName || '';
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        };
        window.copyTextToClipboard = async (text) => {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch {
                return false;
            }
        };
        window.saveTextAsFile = (filename, content) => {
            var link = document.createElement('a');
            link.download = filename;
            link.href = "data:text/plain;charset=utf-8," + encodeURIComponent(content);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
</body>

</html>
